<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Extension Test – Sign Up</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 36px 32px;
      width: 380px;
    }
    h2 { color: #e2e8f0; margin-bottom: 6px; font-size: 22px; }
    p  { color: #64748b; font-size: 13px; margin-bottom: 24px; }
    label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 6px; }
    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: #6366f1; }
    button {
      width: 100%;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    #result {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .success { background: #14532d; color: #86efac; display: block !important; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📝 Create Account</h2>
    <p>Use this to test the KeyVault <strong>password suggestion</strong> feature.</p>

    <form id="signup-form">
      <label for="email">Email</label>
      <input id="email" type="email" name="email"
        placeholder="you@example.com" autocomplete="email" />

      <label for="password">Password</label>
      <input id="password" type="password" name="password"
        placeholder="Choose a password" autocomplete="new-password" />

      <label for="confirm">Confirm Password</label>
      <input id="confirm" type="password" name="confirm"
        placeholder="Confirm your password" autocomplete="new-password" />

      <button type="submit">Create Account</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    document.getElementById("signup-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const result = document.getElementById("result");
      result.textContent = `✅ Account created for: ${email}`;
      result.className = "success";
    });
  </script>
</body>
</html>
